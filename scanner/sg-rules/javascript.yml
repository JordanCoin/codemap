id: js-imports
language: javascript
rule:
  any:
    # Structural, so quote style stops mattering: the literal-text patterns
    # this replaces were hardcoded to double quotes, and single quotes are the
    # Prettier default, so single-quoted imports and requires were invisible.
    - kind: import_statement
    # require() is a call, not an import_statement, so a kind rule alone would
    # lose CommonJS entirely. $$$ binds no $PATH metavariable, which keeps
    # path extraction on the quote-agnostic text path and lets a dynamic
    # require(someVar) resolve to nothing rather than to a fabricated edge.
    - pattern: require($$$)
    # $PATH binds the string's contents, so a quote in a comment or in a
    # string-named export cannot be read as the path. A source-less export has
    # no source field and stays out.
    - all:
        - kind: export_statement
        - has:
            field: source
            kind: string
            has:
              kind: string_fragment
              pattern: $PATH
    # Only a literal first argument names a file: import('./a/' + b) has to
    # add nothing, not an edge to ./a/. Comments do not count as the first
    # argument, so webpack's /* webpackChunkName */ hints still match.
    - all:
        - kind: call_expression
        - has:
            field: function
            kind: import
        - has:
            field: arguments
            has:
              nthChild:
                position: 1
                ofRule:
                  not:
                    kind: comment
              any:
                - kind: string
                  has:
                    kind: string_fragment
                    pattern: $PATH
                - kind: template_string
                  not:
                    has:
                      kind: template_substitution
---
id: js-functions
language: javascript
rule:
  any:
    - kind: function_declaration
    - kind: method_definition
