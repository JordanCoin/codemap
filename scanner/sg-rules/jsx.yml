id: jsx-imports
language: jsx
rule:
  any:
    - kind: import_statement
    # CommonJS require() is a call expression, so kind: import_statement alone
    # never saw it, in either quote style.
    - pattern: require($$$)
    # $PATH binds the string's contents, so a quote in a comment or in a
    # string-named export cannot be read as the path. A source-less export has
    # no source field and stays out.
    - all:
        - kind: export_statement
        - has:
            field: source
            kind: string
            has:
              kind: string_fragment
              pattern: $PATH
    # Only a literal first argument names a file: import('./a/' + b) has to
    # add nothing, not an edge to ./a/. Comments do not count as the first
    # argument, so webpack's /* webpackChunkName */ hints still match.
    - all:
        - kind: call_expression
        - has:
            field: function
            kind: import
        - has:
            field: arguments
            has:
              nthChild:
                position: 1
                ofRule:
                  not:
                    kind: comment
              any:
                - kind: string
                  has:
                    kind: string_fragment
                    pattern: $PATH
                - kind: template_string
                  not:
                    has:
                      kind: template_substitution
---
id: jsx-functions
language: jsx
rule:
  any:
    - kind: function_declaration
    - kind: method_definition
    - kind: arrow_function
