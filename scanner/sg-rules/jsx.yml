id: jsx-imports
language: jsx
rule:
  any:
    - kind: import_statement
    # CommonJS require() is a call expression, so kind: import_statement alone
    # never saw it, in either quote style.
    - pattern: require($$$)
---
id: jsx-functions
language: jsx
rule:
  any:
    - kind: function_declaration
    - kind: method_definition
    - kind: arrow_function
