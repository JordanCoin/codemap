id: tsx-imports
language: tsx
rule:
  any:
    - kind: import_statement
    # CommonJS require() is a call expression, so kind: import_statement alone
    # never saw it, in either quote style.
    - pattern: require($$$)
    # $PATH binds the string's contents, so a quote in a comment or in a
    # string-named export cannot be read as the path. A source-less export has
    # no source field and stays out.
    - all:
        - kind: export_statement
        - has:
            field: source
            kind: string
            has:
              kind: string_fragment
              pattern: $PATH
---
id: tsx-functions
language: tsx
rule:
  any:
    - kind: function_declaration
    - kind: method_definition
    - kind: arrow_function
