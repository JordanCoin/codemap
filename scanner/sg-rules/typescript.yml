id: ts-imports
language: typescript
rule:
  any:
    - kind: import_statement
    # CommonJS require() is a call expression, so kind: import_statement alone
    # never saw it, in either quote style.
    - pattern: require($$$)
---
id: ts-functions
language: typescript
rule:
  any:
    - kind: function_declaration
    - kind: method_definition
    - kind: arrow_function
