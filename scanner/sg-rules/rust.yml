id: rust-use-imports
language: rust
rule:
  any:
    - pattern: use $PATH;
    - pattern: use $PATH::$$$_;
---
id: rust-mod-imports
language: rust
rule:
  any:
    - pattern: mod $PATH;
    - pattern: pub mod $PATH;
---
id: rust-path-module-imports
language: rust
rule:
  all:
    - pattern:
        context: |
          #[path = $TARGET]
          mod __CONTEXT__;
        selector: attribute_item
    - precedes:
        stopBy:
          not:
            kind: attribute_item
        any:
          - pattern: mod $PATH;
          - pattern: pub mod $PATH;
    - not:
        inside:
          kind: mod_item
          stopBy: end
---
id: rust-path-imports
language: rust
rule:
  pattern: $PATH::$$$REST
---
id: rust-askama-template-imports
language: rust
rule:
  any:
    - pattern:
        context: |
          #[template(path = $TARGET)]
          struct __CONTEXT__;
        selector: attribute_item
    - pattern:
        context: |
          #[template(path = $TARGET, $$$REST)]
          struct __CONTEXT__;
        selector: attribute_item
---
id: rust-functions
language: rust
rule:
  kind: function_item
