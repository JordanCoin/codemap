id: lua-imports
language: lua
rule:
  any:
    - kind: function_call
      pattern: require($$$)
    - kind: function_call
      pattern: dofile($$$)
    - kind: function_call
      pattern: require $ARG
      regex: ^require\s*["']
    - kind: function_call
      pattern: dofile $ARG
      regex: ^dofile\s*["']
---
id: lua-functions
language: lua
rule:
  kind: function_declaration
